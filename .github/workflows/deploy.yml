name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手動重部署：Actions 頁按 "Run workflow" 即可用 main 的現行程式碼重新部署，
  # 不必再靠空 commit 觸發（本機 wrangler 對 Pages 專案沒有部署權限）。
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run build
        env:
          NODE_VERSION: "24"
      - name: Flatten dist/client static assets for wrangler Pages
        run: |
          if [ -d dist/client ]; then
            echo "Before flatten: dist/ top-level"
            ls -1 dist/ | head -10
            cp -r dist/client/. dist/
            rm -rf dist/client
            echo ""
            echo "After flatten: dist/ top-level"
            ls -1 dist/ | head -20
            echo ""
            echo "Spot check:"
            ls -1 dist/_astro/page-ssr.*.css && echo "  ✓ dist/_astro/page-ssr.*.css"
            test -f dist/images/banners/slide-1.jpg && echo "  ✓ dist/images/banners/slide-1.jpg"
            test -f dist/favicon.ico && echo "  ✓ dist/favicon.ico"
          else
            echo "dist/client/ not found, skip flatten"
          fi
      - run: pnpm test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      deployments: "write"
    steps:
      - uses: actions/checkout@v6
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=mycafe --branch=main --commit-dirty=true --commit-hash="${{ github.sha }}" --commit-message="$(git log -1 --pretty=%s)"

  preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      deployments: "write"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@v6
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy preview to Cloudflare Pages via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=mycafe --branch=${{ github.head_ref }} --commit-dirty=true
