name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: simple env leak check
        run: |
          if grep -rE '(GMAIL_APP_PASSWORD|JWT_SECRET|ADMIN_PASSWORD|API_TOKEN)\s*=' src/ 2>/dev/null; then
            echo "✗ hardcoded secret-like pattern in src/"
            exit 1
          fi
          echo "✓ no hardcoded secret-like pattern in src/"
