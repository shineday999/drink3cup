<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f3f1ea;
        color: #503827;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Noto Sans SC",
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      svg {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0 0 28px;
        font-size: 15px;
        line-height: 1.7;
        color: #615247;
      }
      button {
        min-height: 48px;
        padding: 0 32px;
        border: 0;
        border-radius: 999px;
        background: #503827;
        color: #fff;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #ba9d88;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0"
        />
        <circle cx="12" cy="19.5" r="0.8" fill="currentColor" />
        <path d="M3 3l18 18" />
      </svg>
      <h1 id="t">目前没有网络连接</h1>
      <p id="d">请检查网络后重试。商品与购物车需要联网才能更新。</p>
      <button id="b" type="button">重新加载</button>
    </main>
    <script>
      (function () {
        var T = {
          "zh-Hant": [
            "目前沒有網路連線",
            "請檢查網路後重試。商品與購物車需要連線才能更新。",
            "重新載入",
          ],
        };
        var l = "zh-Hant";
        document.documentElement.lang = l;
        document.title = T[l][0];
        document.getElementById("t").textContent = T[l][0];
        document.getElementById("d").textContent = T[l][1];
        document.getElementById("b").textContent = T[l][2];
        document.getElementById("b").addEventListener("click", function () {
          location.reload();
        });
        window.addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
